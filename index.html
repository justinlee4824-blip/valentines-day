<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sherry</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe0ec, #fff0f5, #ffd6e7);
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            position: relative;
        }

        /* Floating hearts background */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            z-index: 1;
            padding: 40px;
        }

        .bear {
            font-size: 80px;
            margin-bottom: 10px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #d63384;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2);
        }

        .greeting {
            font-size: 1.2rem;
            color: #c9547a;
            margin-bottom: 8px;
            font-style: italic;
        }

        .pickup-line {
            font-size: 1.1rem;
            color: #d4618c;
            margin-bottom: 25px;
            font-style: italic;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .question {
            font-size: 1.5rem;
            color: #e75480;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        .btn {
            padding: 16px 48px;
            font-size: 1.3rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d, #e91e63);
            color: white;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4);
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(233, 30, 99, 0.6);
        }

        .btn-no {
            background: linear-gradient(135deg, #ffb6c1, #ff85a2);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 133, 162, 0.3);
        }

        /* Celebration overlay */
        .celebration {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe0ec, #fff0f5, #ffd6e7);
            z-index: 100;
            text-align: center;
        }

        .celebration.active {
            display: flex;
        }

        .celebration h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 1s ease-in-out infinite;
        }

        .celebration p {
            font-size: 1.8rem;
            color: #e75480;
            font-weight: 600;
        }

        .celebration .gifts-note {
            font-size: 1.2rem;
            color: #c9547a;
            margin-top: 18px;
            font-style: italic;
        }

        .celebration .big-hearts {
            font-size: 60px;
            margin-top: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .confetti {
            position: fixed;
            top: -10px;
            font-size: 24px;
            animation: confettiFall linear forwards;
            z-index: 101;
            pointer-events: none;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0.7;
            }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>

    <div class="container">
        <div class="bear">🧸</div>
        <h1>Hi My Darling!</h1>
        <p class="greeting">Is your heart taken? Because mine has a reservation for two 💕</p>
        <p class="question">Will you be my Valentine this year and for many more? 💕</p>
        <div class="buttons">
            <button class="btn btn-yes" onclick="sayYes()">Yes! 💖</button>
            <button class="btn btn-no" id="noBtn">No</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <h1>Yaaay! 🎉</h1>
        <p>I knew you'd say yes, Sherry!</p>
        <p class="gifts-note">Don't worry, I have gifts on the way 🎁💝</p>
        <div class="big-hearts">💕🥰💕</div>
    </div>

    <script>
        // Create floating background hearts
        const heartsBg = document.getElementById('heartsBg');
        const heartEmojis = ['💗', '💕', '💖', '💓', '🩷', '🌸', '✨'];

        for (let i = 0; i < 25; i++) {
            const heart = document.createElement('span');
            heart.classList.add('floating-heart');
            heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (15 + Math.random() * 20) + 'px';
            heart.style.animationDuration = (6 + Math.random() * 8) + 's';
            heart.style.animationDelay = (Math.random() * 10) + 's';
            heartsBg.appendChild(heart);
        }

        // Runaway "No" button
        const noBtn = document.getElementById('noBtn');
        let runCount = 0;

        noBtn.addEventListener('mouseover', function () {
            runCount++;
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            let newX = Math.random() * maxX;
            let newY = Math.random() * maxY;

            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noBtn.style.transition = 'none';
            noBtn.style.zIndex = '50';

            // After a few attempts, shrink the no button
            if (runCount > 3) {
                const scale = Math.max(0.4, 1 - runCount * 0.1);
                noBtn.style.transform = `scale(${scale})`;
            }

            // After many attempts, change the text
            if (runCount === 5) noBtn.textContent = "Can't catch me!";
            if (runCount === 8) noBtn.textContent = "Just say yes!";
            if (runCount >= 11) noBtn.textContent = "💖";
        });

        // Also handle touch for mobile
        noBtn.addEventListener('touchstart', function (e) {
            e.preventDefault();
            noBtn.dispatchEvent(new Event('mouseover'));
        });

        // "Yes" celebration
        function sayYes() {
            document.getElementById('celebration').classList.add('active');
            launchConfetti();
        }

        function launchConfetti() {
            const confettiEmojis = ['💖', '💕', '🎉', '✨', '💗', '🩷', '🌸', '🎀', '💘', '🥰'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('span');
                    confetti.classList.add('confetti');
                    confetti.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.animationDuration = (2 + Math.random() * 3) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 80);
            }
        }
    </script>
</body>
</html>
